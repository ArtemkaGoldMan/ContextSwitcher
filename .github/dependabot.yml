# Keeps the libraries and the workflows' actions up to date: a pull request a week at most for each,
# which runs the same checks as any other.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Avalonia and its theme packages move together; one pull request for them.
      avalonia:
        patterns: ["Avalonia*", "Semi.Avalonia*"]
      testing:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
