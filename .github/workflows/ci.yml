name: CI

# What every pull request - and every push to main - has to pass before it can be merged:
#   Build and test   the whole solution with warnings as errors, every test, and how much of the code they reach
#   Build and test (Windows)   the same on Windows, where the tests of macOS itself are skipped
#   App bundle       the signed-or-not .app is built the way a release builds it, checked, and run through its
#                    command line on a machine with no screen; the .app is kept for a week to try by hand
#   Windows package  the installer is built the way a release builds it, installed, run and removed again;
#                    the installer is kept for a week to try by hand
#   Workflows and scripts   the workflows, the shell scripts and the PowerShell scripts are linted
# Of these, main's protection waits for the ones in docs/release-process.md.
#
# The two jobs on a Mac wait for a runner that GitHub has the fewest of, and sometimes can't give: a job that
# gets none in a quarter of an hour is cancelled. So they run only for a change that reaches the Mac (see
# "What changed"), in full on every push to main and every night, and rerun-starved-jobs.yml starts again a
# job that was cancelled for want of a runner. A job that is skipped counts as passed for main's protection.

on:
  pull_request:
  push:
    branches: [main]
  # Every night, in full, so that what only a Mac sees is looked at even when no pull request touches it.
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

# A new push to a pull request makes the run for the one before it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether the change reaches the Mac. A pull request that touches only Windows' own code and its tests,
  # the PowerShell scripts or the docs builds and runs nothing there that differs, so the two Mac jobs below
  # are skipped for it. Anything else - shared code, the Mac's, the projects, the workflows - or anything
  # that isn't a pull request runs them. If this job can't tell, they run.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mac: ${{ steps.files.outputs.mac }}
    steps:
      - name: Does the change reach the Mac?
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PR:-}" ]; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request: the Mac jobs run."
            exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
          # What a Mac neither builds nor runs.
          windows_only='^(src/ContextSwitcher\.Infrastructure\.Windows/|src/ContextSwitcher\.Tests\.Windows/|src/ContextSwitcher\.App/Entry\.Windows\.cs$|scripts/windows/|docs/|[^/]+\.md$)'
          if grep -Ev "$windows_only" files.txt > reaches_the_mac.txt; then
            echo "mac=true" >> "$GITHUB_OUTPUT"
            echo "The change reaches the Mac, so the Mac jobs run. For example:"
            head -10 reaches_the_mac.txt
          else
            echo "mac=false" >> "$GITHUB_OUTPUT"
            echo "Nothing here reaches the Mac: Windows' code and tests, scripts and docs. The Mac jobs are skipped."
          fi

  build-and-test:
    name: Build and test
    needs: changes
    # Not skipped because the question couldn't be answered, and not run after a cancellation.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mac == 'true') }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build --configuration Release -warnaserror --nologo

      - name: Test
        run: >
          dotnet test --configuration Release --no-build --nologo
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Summarise
        if: always()
        run: python3 scripts/summarise-tests.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  # The same on Windows, so a change to shared code is tried on both systems. A job of its own, named
  # apart from "Build and test", which main's protection already asks for by that name.
  build-and-test-windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    # Git's bash, so the steps read as on the Mac.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build --configuration Release -warnaserror --nologo

      - name: Test
        run: >
          dotnet test --configuration Release --no-build --nologo
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # The Windows runner's Python is python, not python3.
      - name: Summarise
        if: always()
        run: python scripts/summarise-tests.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows
          path: TestResults
          retention-days: 14

  app-bundle:
    name: App bundle
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.mac == 'true') }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Signed with the project's certificate only in a release; here there are no secrets (a fork's pull
      # request has none), so it is signed ad hoc - fine for trying a build, which is all this one is for.
      - name: Build the app
        run: ./scripts/build-app.sh dist

      - name: Check the bundle
        run: |
          app=dist/ContextSwitcher.app
          expected="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/ContextSwitcher.App/ContextSwitcher.App.csproj | head -1)"
          actual="$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")"
          [ "$actual" = "$expected" ] || { echo "::error::Info.plist says $actual, the project says $expected"; exit 1; }
          [ "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = "com.artem.contextswitcher" ] \
            || { echo "::error::the bundle identifier changed; macOS keys every permission to it"; exit 1; }
          [ "$(plutil -extract LSUIElement raw -o - "$app/Contents/Info.plist")" = "true" ] \
            || { echo "::error::LSUIElement is not true, so the app would show in the Dock at launch"; exit 1; }
          codesign --verify --deep --strict "$app"
          [ "$(lipo -archs "$app/Contents/MacOS/ContextSwitcher")" = "arm64" ] \
            || { echo "::error::the app is not an arm64-only build"; exit 1; }
          size="$(du -sh "$app" | cut -f1)"
          echo "### App bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "Version $actual, $size, arm64." >> "$GITHUB_STEP_SUMMARY"

      - name: Run it through its command line
        run: ./scripts/smoke-test-app.sh dist/ContextSwitcher.app

      # No unit test can see the menu bar, and 0.6.4 shipped without an icon there after a dependency
      # update; this starts the app and looks.
      - name: Check its menu bar icon
        run: ./scripts/check-menu-bar-icon.sh dist/ContextSwitcher.app

      - name: Pack it
        run: ditto -c -k --keepParent dist/ContextSwitcher.app ContextSwitcher-build.zip

      # To try what a pull request does without building it: unzip, then `xattr -dr com.apple.quarantine`
      # as for any download. Kept a week.
      - uses: actions/upload-artifact@v7
        with:
          name: ContextSwitcher-${{ github.sha }}
          path: ContextSwitcher-build.zip
          retention-days: 7

  # The Windows installer, built as a release builds it and then put through what a person does: install,
  # start, start a second copy, remove. No unit test can see an installer. Not signed, so Windows would ask
  # once before running the downloaded file; here it is run by the script, which Windows doesn't ask about.
  windows-package:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the installer
        shell: pwsh
        run: ./scripts/windows/build-installer.ps1

      - name: Install it, run it and remove it
        shell: pwsh
        run: ./scripts/windows/smoke-test-installer.ps1

      # To try what a pull request does without building it: run it; Windows asks once, as it does for
      # any download that isn't signed. Kept a week.
      - uses: actions/upload-artifact@v7
        with:
          name: ContextSwitcher-win-${{ github.sha }}
          path: dist/windows/ContextSwitcher-win-Setup.exe
          retention-days: 7

  lint:
    name: Workflows and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

      - name: Lint the shell scripts
        run: shellcheck --severity=warning scripts/*.sh install.sh

      - name: Compile the Python scripts
        run: python3 -m py_compile scripts/*.py

      # Pinned, like actionlint above: a new rule in a new version shouldn't fail a pull request that
      # touched nothing.
      - name: Lint the PowerShell scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path scripts/windows -Recurse -Severity Warning, Error
          $findings | Format-Table -AutoSize | Out-String | Write-Output
          if ($findings) { exit 1 }
